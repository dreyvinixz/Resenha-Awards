services:
  - type: web
    name: resenha-awards
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: resenha-awards-db
          property: connectionString
      - key: RESENHA_ACCESS_SEED
        generateValue: true
      - key: RESENHA_ADMIN_TOKEN
        generateValue: true
      - key: RESENHA_ALLOW_EDITS
        value: "false"
databases:
  - name: resenha-awards-db
    databaseName: resenha_awards
    region: ohio
    plan: free
    ipAllowList: []
