services:
  - type: web
    name: resenha-awards
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "1574851827600593117"
      - key: DISCORD_GUILD_ID
        value: "1137596579746955278"
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: RESENHA_ADMIN_TOKEN
        generateValue: true
